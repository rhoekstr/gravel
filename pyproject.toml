[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "gravel-fragility"
version = "2.4.0"
description = "Fast road network fragility analysis with contraction hierarchies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Robert Hoekstra", email = "rhoekstr@gmail.com" },
]
# numpy is a hard dependency: the core Graph array accessors (node_coordinates,
# to_coo, from_coo) and the CSR constructor return/accept numpy arrays. It is the
# floor of the scientific-Python stack and present in essentially every relevant
# deployment. Heavier integrations (NetworkX, GeoPandas) stay in the [interop] extra.
dependencies = [
    "numpy>=1.23",
]
keywords = [
    "routing",
    "graph",
    "contraction-hierarchy",
    "road-network",
    "fragility",
    "isolation-analysis",
    "transportation",
    "disaster-resilience",
    "osm",
    "openstreetmap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
# numpy is a core dependency (see [project].dependencies); this extra adds the
# heavier graph/geo integrations used by gravel.interop.
interop = [
    "networkx>=3.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
]
viz = [
    "matplotlib>=3.7",
    "lonboard>=0.16",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
]
pipeline = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/rhoekstr/gravel"
Documentation = "https://rhoekstr.github.io/gravel/"
Repository = "https://github.com/rhoekstr/gravel"
Issues = "https://github.com/rhoekstr/gravel/issues"
Changelog = "https://github.com/rhoekstr/gravel/blob/main/CHANGELOG.md"
"Project Page (Awry Labs)" = "https://awrylabs.com/gravel.html"
"Kindling (related project)" = "https://awrylabs.com/kindling.html"
"Author Website" = "https://awrylabs.com/"

# ============================================================
# scikit-build-core configuration
# ============================================================

[tool.scikit-build]
wheel.packages = ["python/gravel"]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.verbose = false
cmake.version = ">=3.24"

# Editable install settings: redirect imports to a persistent editable location
# so `pip install -e .` properly places _gravel.so alongside the gravel package.
editable.rebuild = true

[tool.scikit-build.cmake.define]
GRAVEL_BUILD_PYTHON = "ON"
GRAVEL_BUILD_CLI = "OFF"
GRAVEL_BUILD_TESTS = "OFF"
GRAVEL_BUILD_BENCH = "OFF"
# AUTO is the source-build-friendly default — builds gracefully with or
# without libosmium and emits a clear CMake status message either way.
# cibuildwheel explicitly installs libosmium before each wheel build and
# then passes GRAVEL_USE_OSMIUM=ON so wheel builds fail fast if the
# pre-install didn't happen (rather than silently shipping an OSM-less
# wheel because of a broken before-build hook).
GRAVEL_USE_OSMIUM = "AUTO"

# Source distribution: include everything needed to build from source
[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "cmake/**",
    "include/**",
    "src/**",
    "third_party/**",
    "python/**",
    "tests/CMakeLists.txt",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "build/**",
    "output/**",
    "**/__pycache__/**",
    "**/*.pyc",
    ".github/**",
    "tests/data/**",
]

# ============================================================
# Ruff linting
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B",
]
ignore = [
    "E501",  # line too long (formatter enforces)
    "N803",  # argument name lowercase (we use FIPS, CH, etc.)
    "N806",  # variable in function lowercase
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional
"python/gravel/__init__.py" = ["F401"]
# Scripts need to mutate sys.path before importing gravel
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = "test_*.py"

# ============================================================
# cibuildwheel — binary wheel generation
# ============================================================

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*"]
# TOML literal string (single-quoted) so we can embed double-quotes
# without escaping. cmd.exe on Windows does not recognize single
# quotes as arg delimiters, so the Python -c argument must be
# double-quoted for the command to parse on all three platforms.
# Also assert HAS_OSM — every wheel shipped from CI must have OSM
# enabled (the before-all hooks install libosmium); if a wheel escapes
# CI without OSM, the test_command fails fast.
test-command = 'python -c "import gravel; assert gravel.HAS_OSM, \"OSM missing\"; print(gravel.__version__)"'

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# manylinux_2_17 (Rocky Linux 8) ships with zlib-devel and expat-devel,
# but NOT bzip2-devel — libosmium's bzip2_compression.hpp fails without
# it. lz4-devel is optional; its absence means we lose lz4-compressed
# PBF input (a rare OSM codec).
# libosmium + protozero are header-only — extract pinned releases into
# /usr/local/include where cmake/OsmiumDetect.cmake's find_path picks
# them up. (Eigen is vendored at third_party/eigen — no fetch needed.)
before-all = """
yum install -y bzip2-devel lz4-devel || true
cd /tmp
curl -sL https://github.com/osmcode/libosmium/archive/refs/tags/v2.20.0.tar.gz | tar xz
cp -r libosmium-2.20.0/include/osmium /usr/local/include/
curl -sL https://github.com/mapbox/protozero/archive/refs/tags/v1.7.1.tar.gz | tar xz
cp -r protozero-1.7.1/include/protozero /usr/local/include/
"""
environment = { CMAKE_ARGS = "-DGRAVEL_USE_OSMIUM=ON" }

[tool.cibuildwheel.macos]
# arm64 only. The macos-latest runner is Apple Silicon; Homebrew provides an
# arm64-only libomp, so an x86_64 cross-build (built under Rosetta with an x86_64
# Python) links no OpenMP runtime and the wheel fails to import with a missing
# __kmpc_* symbol. Rather than ship a broken or silently-serial Intel wheel, we
# ship arm64 wheels with OpenMP and let Intel-Mac users install from the sdist
# (which builds offline thanks to the vendored Eigen, picking up their own libomp).
# Apple stopped selling Intel Macs in 2023.
archs = ["arm64"]
# std::filesystem requires macOS 10.15+ (cibuildwheel's 10.9 default trips
# "'exists' is unavailable"). GRAVEL_OSMIUM_LZ4=OFF: the runner's
# /opt/homebrew/lib/liblz4.dylib (built for macOS 15+) gets vendored by delocate
# and fails the wheel's deployment target; libosmium's lz4 support is rare anyway.
# libomp gives Apple Clang an OpenMP runtime; cmake/OpenMPDetect.cmake locates it
# via `brew --prefix libomp` and delocate vendors libomp.dylib into the wheel.
# (Eigen is vendored at third_party/eigen.)
#
# Homebrew builds libomp on the macOS-15 runner, so its dylib declares a minimum
# target of 15.0. delocate then refuses to vendor it into our macOS-11 wheel
# ("Library dependencies do not satisfy target MacOS version 11.0"). The OpenMP
# runtime is genuinely fine on macOS 11 — the 15.0 is just an artifact of the build
# host — so rewrite the declared min-OS down to 11.0 with vtool. delocate re-signs
# vendored dylibs, so the edit holds.
before-all = """
brew install libosmium protozero libomp
LIBOMP="$(brew --prefix libomp)/lib/libomp.dylib"
xcrun vtool -set-build-version macos 11.0 11.0 -replace -output /tmp/libomp.dylib "$LIBOMP"
cp -f /tmp/libomp.dylib "$LIBOMP"
"""
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CMAKE_ARGS = "-DGRAVEL_USE_OSMIUM=ON -DGRAVEL_OSMIUM_LZ4=OFF" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Pre-install C++ deps via vcpkg so CMake's find_package (enabled by
# FIND_PACKAGE_ARGS on our FetchContent_Declare entries) picks them up,
# bypassing git-clone over Windows runner networks. libosmium + protozero +
# runtime libs (zlib/expat/bz2/lz4) are all vcpkg ports. (Eigen is vendored at
# third_party/eigen — no vcpkg eigen3, which now resolves to the wrong major 5.0.)
before-all = "vcpkg install libosmium protozero zlib expat bzip2 lz4"
# cibuildwheel auto-installs delvewheel when using the default
# repair-wheel-command, but skips that install when we override the
# command. Explicitly pip-install delvewheel into the per-wheel build
# venv so `python -m delvewheel` resolves at repair time.
before-build = "pip install delvewheel"
environment = { CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DGRAVEL_USE_OSMIUM=ON" }
# delvewheel scans PATH for DLLs to vendor into the wheel but doesn't
# know about vcpkg's install tree. --add-path points it at
# C:/vcpkg/installed/x64-windows/bin so zlib1.dll / libexpat.dll /
# bz2.dll / liblz4.dll get bundled. Without this the wheel's _gravel
# fails at import time on clean machines with
#   ImportError: DLL load failed while importing _gravel
repair-wheel-command = "python -m delvewheel repair -w {dest_dir} --add-path C:/vcpkg/installed/x64-windows/bin {wheel}"
